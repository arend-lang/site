title: Arend Theorem Prover
name: Arend
description: The Arend Theorem Prover
url: https://arend-lang.github.io
github: [metadata]
github_username: arend-lang

theme: minimal-mistakes-jekyll

# The minimal-mistakes theme (and its vendored susy/breakpoint/magnific-popup
# libraries) still use SCSS patterns that Dart Sass now deprecates (@import,
# global built-in functions, `/` division). These are upstream, not our code,
# so silence the dependency noise to keep real warnings visible.
sass:
  quiet_deps: true
  silence_deprecations:
    - import

paginate: 5

author:
  avatar: /assets/images/Logo_vert.svg

defaults:
  - scope:
      path: "documentation"
    values:
      layout: single
      sidebar:
        nav: "documentation"
      toc: true
      toc_sticky: true

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/JetBrains/Arend"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/ArendLang"

keep_files: [.git, LICENSE, README.md]
